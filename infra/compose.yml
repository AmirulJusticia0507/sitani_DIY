name: sitani-diy

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib diisi}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      TZ: Asia/Jakarta
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
      SSO_JSP_ISSUER: ${SSO_JSP_ISSUER:-https://sso.jogjaprov.go.id/realms/jsp}
      SSO_JSP_CLIENT_ID: ${SSO_JSP_CLIENT_ID:-portal}
      SSO_JSP_CLIENT_SECRET: ${SSO_JSP_CLIENT_SECRET:-}
      SSO_SATRIYA_ISSUER: ${SSO_SATRIYA_ISSUER:-https://sso.jogjaprov.go.id/realms/satriya}
      SSO_SATRIYA_CLIENT_ID: ${SSO_SATRIYA_CLIENT_ID:-portal}
      SSO_SATRIYA_CLIENT_SECRET: ${SSO_SATRIYA_CLIENT_SECRET:-}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      SSO_COOKIE_SECURE: ${SSO_COOKIE_SECURE:-false}
      SSO_REFRESH_SKEW_SECONDS: ${SSO_REFRESH_SKEW_SECONDS:-60}
      SSO_TOKEN_LEEWAY_SECONDS: ${SSO_TOKEN_LEEWAY_SECONDS:-60}
      # Login lokal development/UAT (docs/login-lokal-development.md). Backend
      # menolak mengaktifkannya bila lingkungan terdeteksi produksi.
      SITANI_DEV_LOGIN: ${SITANI_DEV_LOGIN:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-sitani-dokumen}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_MAX_UPLOAD_MB: ${MINIO_MAX_UPLOAD_MB:-20}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
      TZ: Asia/Jakarta
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - internal

  # Layanan pengembangan tambahan (profil minio). Bucket dibuat otomatis
  # saat backend pertama kali terhubung. Gunakan:
  #   docker compose --env-file .env --profile minio -f infra/compose.yml up -d
  # Dengan MINIO_ENDPOINT=storage:9000 pada .env agar backend menemukannya.
  storage:
    image: minio/minio:latest # versi produksi disetel saat deployment bersama pengelola
    command: server /data --console-address ":9001"
    profiles: ["minio"]
    restart: unless-stopped
    environment:
      # Layanan ini hanya untuk pengembangan (profil minio). Produksi memakai
      # instance MinIO resmi pengelola, bukan container ini.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio-dev-sitani}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - internal

volumes:
  postgres_data:
  minio_data:

networks:
  internal:
    driver: bridge

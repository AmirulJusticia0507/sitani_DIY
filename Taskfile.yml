version: '3'

dotenv:
  - .env

tasks:
  dev:
    desc: Jalankan backend Go untuk pengembangan lokal
    dir: backend
    env:
      PORT: '{{.DEV_BACKEND_PORT}}'
      # Nilai .env dipakai Compose (localhost:3001); task dev harus memakai
      # origin frontend dev agar CORS dan pemeriksaan Origin login tidak 403.
      FRONTEND_PUBLIC_URL: '{{.DEV_FRONTEND_URL}}'
      # Harus sama dengan PORT dev; redirect_uri callback memakai nilai ini.
      BACKEND_PUBLIC_URL: '{{.DEV_BACKEND_URL}}'
      DB_DSN: '{{.DB_DSN | default (printf "postgres://%s:%s@127.0.0.1:%s/%s?sslmode=disable" .POSTGRES_USER .POSTGRES_PASSWORD .POSTGRES_HOST_PORT .POSTGRES_DB)}}'
    cmds:
      - go run ./cmd/api

  migrate:
    desc: Terapkan migrasi PostgreSQL lokal
    dir: backend
    env:
      DB_DSN: '{{.DB_DSN | default (printf "postgres://%s:%s@127.0.0.1:%s/%s?sslmode=disable" .POSTGRES_USER .POSTGRES_PASSWORD .POSTGRES_HOST_PORT .POSTGRES_DB)}}'
    cmds:
      - go run ./cmd/migrate

  seed-dev:
    desc: Buat akun login lokal development (butuh SEED_DEV_PASSWORD)
    dir: backend
    env:
      DB_DSN: '{{.DB_DSN | default (printf "postgres://%s:%s@127.0.0.1:%s/%s?sslmode=disable" .POSTGRES_USER .POSTGRES_PASSWORD .POSTGRES_HOST_PORT .POSTGRES_DB)}}'
      SEED_DEV_PASSWORD: '{{.SEED_DEV_PASSWORD}}'
    cmds:
      - go run ./cmd/seed-dev

  frontend:
    desc: Jalankan frontend Next.js untuk pengembangan lokal
    dir: frontend
    env:
      NEXT_PUBLIC_BACKEND_URL: '{{.DEV_BACKEND_URL}}'
    cmds:
      # Host binding mengikuti DEV_FRONTEND_HOST agar Origin yang dikirim browser
      # sama persis dengan FRONTEND_PUBLIC_URL (127.0.0.1 dan localhost berbeda).
      - npm run dev -- --hostname {{.DEV_FRONTEND_HOST}} --port {{.DEV_FRONTEND_PORT}}

  test:
    desc: Jalankan seluruh unit test backend
    dir: backend
    cmds:
      - go test ./...

  check:
    desc: Jalankan pemeriksaan statis dan build backend
    dir: backend
    cmds:
      - go vet ./...
      - go build ./...

version: '3'

dotenv:
  - .env

tasks:
  dev:
    desc: Jalankan backend Go untuk pengembangan lokal
    dir: backend
    env:
      PORT: '{{.DEV_BACKEND_PORT}}'
      FRONTEND_PUBLIC_URL: '{{.DEV_FRONTEND_URL}}'
      DB_DSN: '{{.DB_DSN | default (printf "postgres://%s:%s@127.0.0.1:%s/%s?sslmode=disable" .POSTGRES_USER .POSTGRES_PASSWORD .POSTGRES_HOST_PORT .POSTGRES_DB)}}'
    cmds:
      - go run ./cmd/api

  migrate:
    desc: Terapkan migrasi PostgreSQL lokal
    dir: backend
    env:
      DB_DSN: '{{.DB_DSN | default (printf "postgres://%s:%s@127.0.0.1:%s/%s?sslmode=disable" .POSTGRES_USER .POSTGRES_PASSWORD .POSTGRES_HOST_PORT .POSTGRES_DB)}}'
    cmds:
      - go run ./cmd/migrate

  frontend:
    desc: Jalankan frontend Next.js untuk pengembangan lokal
    dir: frontend
    env:
      NEXT_PUBLIC_BACKEND_URL: '{{.DEV_BACKEND_URL}}'
    cmds:
      - npm run dev -- --hostname 127.0.0.1 --port {{.DEV_FRONTEND_PORT}}

  test:
    desc: Jalankan seluruh unit test backend
    dir: backend
    cmds:
      - go test ./...

  check:
    desc: Jalankan pemeriksaan statis dan build backend
    dir: backend
    cmds:
      - go vet ./...
      - go build ./...
